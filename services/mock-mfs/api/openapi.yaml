openapi: 3.0.3
info:
  title: mock-mfs API
  version: 1.0.0
  description: Mock Mobile Financial Services payment gateway (bKash-like).
servers:
  - url: http://mock-mfs:5011
paths:
  /livez:
    get:
      summary: Liveness health check
      responses:
        '200':
          description: OK
  /health:
    post:
      summary: JWE-authenticated health check
      security:
        - JWEAuth: []
      responses:
        '200':
          description: JWE-encrypted healthy response
        '401':
          description: Unauthorized
components:
  securitySchemes:
    JWEAuth:
      type: http
      scheme: bearer
      bearerFormat: JWE
