openapi: 3.0.3
info:
  title: orchestrator API
  version: 1.0.0
  description: Workflow orchestration service executing payment journeys and downstream steps.
servers:
  - url: http://orchestrator:4010
paths:
  /livez:
    get:
      summary: Liveness health check (unsigned)
      responses:
        '200':
          description: OK
  /health:
    post:
      summary: JWE-authenticated service mesh health check
      security:
        - JWEAuth: []
      responses:
        '200':
          description: JWE-encrypted healthy response
        '401':
          description: Missing or invalid JWE token
  /journeys:
    post:
      summary: Start a new customer journey
      security:
        - JWEAuth: []
      responses:
        '201':
          description: Journey created
  /journeys/{id}:
    get:
      summary: Query journey and step progress
      security:
        - JWEAuth: []
      responses:
        '200':
          description: Journey status
components:
  securitySchemes:
    JWEAuth:
      type: http
      scheme: bearer
      bearerFormat: JWE
